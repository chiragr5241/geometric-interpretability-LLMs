[project]
name = "geometric-interpretability-llms"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.10.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jax>=0.9.0.1",
    "jaxlib>=0.9.0.1",
    "jupyter>=1.1.1",
    "kaleido>=1.2.0",
    "matplotlib>=3.9.0",
    "networkx>=3.3",
    "numpy>=2.0",
    "openai>=1.0.0",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.2",
    "simplexity",
    "torch>=2.6.0",
    "tqdm>=4.66.0",
    "transformer-lens>=2.15.4",
    "transformers>=5.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
simplexity = { git = "https://github.com/Astera-org/simplexity.git" }
torch = [{ index = "pytorch-cu126" }]
