experiment_name: train_pooled_probes

n_train_sequences: 10
n_test_sequences: 5
max_probes_per_batch: 80

hmm:
  process_name: mess3
  process_params:
    x: 0.05
    alpha: 0.9

model_name: "meta-llama/Llama-3.2-3B"
n_ctx_override: 10000

# Sparser layer set — sufficient to characterise the emergence curve (SPAR-12)
layer_indices: [0, 1, 2, 3, 4, 5, 6, 10, 15, 20, 25, 27]

seq_length: 5000

kl_params:
  fraction: 0.02
  smooth_window: 5
  min_position: 20
  include_junk: true

vocab_mapping:
  "A": 0
  "B": 1
  "C": 2
