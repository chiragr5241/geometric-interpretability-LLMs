experiment_name: token_probability_diagnostic
output_user: dani

n_sequences: 50
seq_length: 500
top_k_report: 50
top_k_heatmap: 20

hmm:
  process_name: mess3
  process_params:
    x: 0.05
    alpha: 0.9

# TransformerLens model name for Llama 3.2 3B
model_name: "meta-llama/Llama-3.2-3B"

# Maps HMM token string -> HMM output index
vocab_mapping:
  "A": 0
  "B": 1
  "C": 2
