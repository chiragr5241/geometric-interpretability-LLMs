experiment_name: emergence_curve

pooled_probe_dir: "outputs/dani/20260306_190511_train_pooled_probes"

n_sequences: 30
seq_length: 1000
batch_size: 8

sliding_window: 30
min_reporting_position: 5
r2_threshold: 0.9
strip_bos: true

ccf_max_lag: 200
ccf_smooth_window: 15
ccf_n_tokens: 150
auc_quantiles: [0.50, 0.90, 0.95, 0.99]

simplex_n_sequences: 3
simplex_positions: [1, 3, 5, 10, 15, 20, 30, 50, 100, 200]

hmm:
  process_name: mess3
  process_params:
    x: 0.05
    alpha: 0.9

model_name: "meta-llama/Llama-3.2-3B"
n_ctx_override: 10000

layer_indices: [0, 1, 2, 3, 4, 5, 6, 10, 15, 20, 25, 27]

kl_params:
  fraction: 0.02
  smooth_window: 5
  min_position: 20
  include_junk: true

vocab_mapping:
  "A": 0
  "B": 1
  "C": 2
